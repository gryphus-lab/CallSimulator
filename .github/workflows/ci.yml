name: CI — Tests & SonarQube Scan

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    env:
      # Promoted to job level so step `if:` conditions can test for its presence.
      # Empty on Dependabot / fork PRs (GitHub withholds secrets there).
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Set up mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d
     
      - name: Run checkstyle
        run: mise run check
      - name: Build project
        run: mise run build
      - name: Run tests
        run: mise run test
      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Cache Gradle packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle') }}
          restore-keys: ${{ runner.os }}-gradle
      # SonarCloud needs SONAR_TOKEN, which GitHub does NOT expose to
      # pull_request runs triggered by Dependabot (or forks). Skip the scan when
      # the token is absent so those PRs aren't failed by an auth error; it still
      # runs on pushes to main and on internal branch PRs. (The `build` + tests
      # above already validate the change; `sonar` triggers its own build/coverage
      # dependencies when it runs.)
      - name: SonarQube Scan
        if: ${{ env.SONAR_TOKEN != '' }}
        run: ./gradlew build sonar --info

      - name: Assemble debug build
        run: mise run assemble-debug
